name: Android build and APK

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Tests, lint and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android 17 SDK and normalize platform path
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
          echo "Installed platform packages:"
          sdkmanager --list | grep -E 'platforms;android-37(\\.0)?|build-tools;36\\.0\\.0' || true
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -d "$ANDROID_HOME/platforms/android-37"
          test -f "$ANDROID_HOME/platforms/android-37/android.jar"

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: ./gradlew --no-daemon lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Prepare APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_SOURCE"
          mkdir -p dist
          cp "$APK_SOURCE" "dist/SMS-Forwarding-debug.apk"
          (cd dist && sha256sum SMS-Forwarding-debug.apk > SHA256SUMS.txt)
          test -s "dist/SMS-Forwarding-debug.apk"
          test -s "dist/SHA256SUMS.txt"
          stat --printf='APK size: %s bytes\\n' "dist/SMS-Forwarding-debug.apk"
          cat "dist/SHA256SUMS.txt"

      - name: Upload installable debug APK
        id: upload-apk
        uses: actions/upload-artifact@v7
        with:
          name: sms-forwarding-apk
          path: |
            dist/SMS-Forwarding-debug.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Write build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## SMS Forwarding Android build"
            echo ""
            echo "- APK: dist/SMS-Forwarding-debug.apk"
            echo "- Signing: Gradle debug signing configuration"
            echo "- Artifact ID: ${{ steps.upload-apk.outputs.artifact-id }}"
            echo "- Artifact URL: ${{ steps.upload-apk.outputs.artifact-url }}"
            echo "- Artifact digest: ${{ steps.upload-apk.outputs.artifact-digest }}"
          } >> "$GITHUB_STEP_SUMMARY"
