name: Android build and APK

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Tests, lint and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0
      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Run Android lint
        run: ./gradlew --no-daemon lintDebug
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Prepare APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_SOURCE"
          mkdir -p dist
          cp "$APK_SOURCE" "dist/SMS-Forwarding-debug.apk"
          (cd dist && sha256sum SMS-Forwarding-debug.apk > SHA256SUMS.txt)
          test -s "dist/SMS-Forwarding-debug.apk"
          test -s "dist/SHA256SUMS.txt"
          stat --printf='APK size: %s bytes\\n' "dist/SMS-Forwarding-debug.apk"
          cat "dist/SHA256SUMS.txt"
      - name: Upload installable debug APK
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: sms-forwarding-apk
          path: |
            dist/SMS-Forwarding-debug.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
      - name: Write build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## SMS Forwarding Android build"
            echo ""
            echo "- APK: dist/SMS-Forwarding-debug.apk"
            echo "- Signing: Gradle debug signing configuration"
            echo "- Artifact ID: ${{ steps.upload-apk.outputs.artifact-id }}"
            echo "- Artifact URL: ${{ steps.upload-apk.outputs.artifact-url }}"
            echo "- Artifact digest: ${{ steps.upload-apk.outputs.artifact-digest }}"
          } >> "$GITHUB_STEP_SUMMARY"
